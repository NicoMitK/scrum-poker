name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff

      - name: Check formatting and common mistakes
        run: ruff check .

  smoke:
    name: Smoke test (real server)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the server
        run: |
          python server.py --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done

      - name: The page loads
        run: curl -sf http://127.0.0.1:8000/ | grep -q "Scrum Poker"

      - name: The deck is correct
        run: |
          curl -sf http://127.0.0.1:8000/api/state \
            | grep -q '"deck": \["0.25", "0.5", "1", "2", "3", "5", "8", "13", "21+", "coffee"\]'

      - name: Only the Product Owner may reveal
        run: |
          DEV=$(curl -sf -X POST http://127.0.0.1:8000/api/join \
            -H 'Content-Type: application/json' \
            -d '{"name":"Dev","role":"technical_operations"}' \
            | python -c "import json,sys; print(json.load(sys.stdin)['token'])")

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/reveal \
            -H "X-Poker-Token: $DEV")

          test "$CODE" = "403" || (echo "expected 403, got $CODE" && exit 1)

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, lint, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret set - skipping."
            echo "Render already auto-deploys on push when the repo is connected."
            exit 0
          fi
          curl -sf -X POST "$HOOK" > /dev/null
          echo "Deploy triggered."
