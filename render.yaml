# Render Blueprint - https://render.com/docs/blueprint-spec
# Free hosting that can actually run the Python server (unlike GitHub Pages).
services:
  - type: web
    name: scrum-poker
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
